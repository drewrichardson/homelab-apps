apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
spec:
  replicas: 0 # TEMP: scaled down for initial data migration, see README
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matter-server
  template:
    metadata:
      labels:
        app: matter-server
    spec:
      # Same node as Home Assistant on purpose -- Matter commissioning relies
      # on mDNS/multicast on the real LAN, and both need hostNetwork anyway.
      nodeSelector:
        kubernetes.io/hostname: greyskull-1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: matter-server
          image: ghcr.io/home-assistant-libs/python-matter-server:stable
          ports:
            - containerPort: 5580
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server-data
