apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.4
    helm:
      values: |
        grafana:
          # Pinned via a SealedSecret (kube-prometheus-stack-secrets app)
          # instead of the chart's auto-generated password -- that password
          # was silently rotating on every ArgoCD sync, because the chart's
          # random-password template renders a different value every
          # comparison and selfHeal "corrected" the apparent drift each time.
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana
          persistence:
            enabled: true
            storageClassName: local-path
            size: 1Gi

          # SSO via Keycloak (see homelab-apps' openldap/keycloak Applications).
          # Client secret pinned via SealedSecret (kube-prometheus-stack-secrets
          # app), injected as an env var rather than in grafana.ini directly --
          # same existingSecret reasoning as the admin password above.
          envFromSecret: grafana-oidc-credentials
          # role_attribute_path has to be set here, not in grafana.ini below,
          # because grafana.ini values go through Grafana's own INI-value
          # parser, which strips matching leading/trailing quote characters
          # as normal INI quoting convention -- confirmed via debug logs
          # (org.sync showed "Role: " completely empty): it silently turned
          # our quoted JMESPath literal 'Admin' into the bare word Admin,
          # which JMESPath then read as a field lookup instead of a string
          # literal. Env vars don't go through that parser.
          env:
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Admin'"
          grafana.ini:
            server:
              # Without this, Grafana builds its OAuth redirect_uri from its
              # own internal defaults (confirmed: it came back as
              # http://grafana:3000/login/generic_oauth, the in-pod port --
              # not the real ingress URL), which Keycloak then rejects since
              # only the actual public URL is a registered redirect URI on
              # the client.
              root_url: http://grafana/
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              client_id: grafana
              scopes: openid profile email
              auth_url: http://keycloak/realms/homelab/protocol/openid-connect/auth
              token_url: http://keycloak/realms/homelab/protocol/openid-connect/token
              api_url: http://keycloak/realms/homelab/protocol/openid-connect/userinfo
              login_attribute_path: preferred_username
              # Single-operator homelab -- anyone who can authenticate via this
              # SSO connection is the same person, so grant Admin unconditionally
              # rather than building out real role-claim mapping for one user.
              # (Actual value set via env above, see comment there.)
              #
              # skip_org_role_sync: Grafana 13's generic_oauth provider
              # defaults to NOT syncing org role from the IdP at all --
              # first attempt without this landed testuser as Viewer
              # despite a correctly-evaluating role_attribute_path.
              skip_org_role_sync: false
              allow_sign_up: true

        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            retention: 15d

        # hwmon collector exposes hardware sensors (incl. CPU temperature) via
        # the node's /sys -- requires lm-sensors + the coretemp kernel module
        # loaded on the host (see ansible/playbooks/bootstrap_node.yml).
        prometheus-node-exporter:
          extraArgs:
            - --collector.hwmon
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # This chart's CRDs (Prometheus, Alertmanager especially) are huge --
      # large enough to exceed the size limit on kubectl's client-side
      # last-applied-configuration annotation, which is what ArgoCD's
      # default apply strategy uses. They silently got stuck permanently
      # OutOfSync as a result (confirmed: kubectl get prometheus errored
      # "the server doesn't have a resource type", and the Prometheus pod
      # never got created at all). Server-side apply doesn't use that
      # annotation, so it doesn't hit the limit.
      - ServerSideApply=true
