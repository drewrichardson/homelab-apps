apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      values: |
        # Pinned via a SealedSecret (minio-secrets app) -- letting the
        # chart auto-generate turned out to have the same silent-rotation
        # bug Grafana had: its random-credential template renders a
        # different value every ArgoCD comparison, and selfHeal
        # "corrected" the apparent drift by reapplying fresh ones each
        # sync. Confirmed: root credentials didn't match what was
        # recorded when this was first deployed.
        existingSecret: minio-root-credentials
        mode: standalone

        persistence:
          enabled: true
          storageClass: local-path
          size: 20Gi

        resources:
          requests:
            memory: 512Mi

        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - minio

        consoleIngress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - minio-console

        # This node is the only one guaranteed online; state storage needs
        # to be reliably reachable, same reasoning as Home Assistant's
        # node pinning earlier.
        nodeSelector:
          kubernetes.io/hostname: greyskull-1
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
