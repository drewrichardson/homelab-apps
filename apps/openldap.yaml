apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openldap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jp-gouin.github.io/helm-openldap/
    chart: openldap
    targetRevision: 2.0.4
    helm:
      values: |
        # Single instance -- homelab scale, avoids the chart's default
        # 3-way replication complexity. Same reasoning as MinIO's
        # standalone mode.
        replicaCount: 1
        # Chart defaults this to true regardless of replicaCount, which
        # renders a self-referential syncrepl config (the one replica
        # pointed at itself). Confirmed via helm template: leaving it
        # enabled here produces LDAP_REPLICATION_HOSTS listing only the
        # pod's own headless DNS name. Disabled since there's nothing to
        # replicate to.
        replication:
          enabled: false

        # Pinned via a SealedSecret (openldap-secrets app). The chart
        # writes LDAP_ADMIN_PASSWORD/LDAP_CONFIG_PASSWORD into a plain
        # Secret itself when this is unset -- existingSecret skips that
        # and points envFrom at ours instead (keys must match exactly:
        # LDAP_ADMIN_PASSWORD, LDAP_CONFIG_PASSWORD).
        existingSecret: openldap-credentials

        env:
          LDAP_ORGANISATION: "Homelab"
          LDAP_DOMAIN: "homelab.local"
          # Base DN derived from LDAP_DOMAIN: dc=homelab,dc=local
          # Plaintext LDAP -- traffic never leaves the cluster network,
          # same risk posture already accepted for MinIO/Grafana's
          # internal traffic. Revisit before wiring SSSD on the NUCs.
          LDAP_TLS: "false"

        tls:
          enabled: false

        # Seeds the base structure plus one test user, for verifying the
        # directory works end-to-end. No userPassword attribute here on
        # purpose -- this file is a plain ConfigMap (not sealed), so a
        # real password doesn't belong in it. Set one manually after
        # deploy with ldappasswd, same pattern as ArgoCD's initial admin
        # password (fetched once, never stored in git). posixAccount /
        # posixGroup attributes are included now since they're free to
        # seed here and the deferred SSSD/PAM phase will need them.
        customLdifFiles:
          01-structure.ldif: |-
            dn: ou=people,dc=homelab,dc=local
            objectClass: organizationalUnit
            ou: people

            dn: ou=groups,dc=homelab,dc=local
            objectClass: organizationalUnit
            ou: groups
          02-testuser.ldif: |-
            dn: cn=testuser,ou=groups,dc=homelab,dc=local
            objectClass: posixGroup
            cn: testuser
            gidNumber: 10000

            dn: uid=testuser,ou=people,dc=homelab,dc=local
            objectClass: inetOrgPerson
            objectClass: posixAccount
            objectClass: shadowAccount
            uid: testuser
            cn: Test User
            sn: User
            uidNumber: 10000
            gidNumber: 10000
            homeDirectory: /home/testuser
            loginShell: /bin/bash
            mail: testuser@homelab.local
          03-drew.ldif: |-
            dn: cn=drew,ou=groups,dc=homelab,dc=local
            objectClass: posixGroup
            cn: drew
            gidNumber: 10001

            dn: uid=drew,ou=people,dc=homelab,dc=local
            objectClass: inetOrgPerson
            objectClass: posixAccount
            objectClass: shadowAccount
            uid: drew
            cn: Drew Richardson
            sn: Richardson
            givenName: Drew
            uidNumber: 10001
            gidNumber: 10001
            # Full SSH migration: the local `drew` account on each NUC is
            # renamed (not deleted) to free the username for this LDAP
            # identity to resolve via nsswitch's "sss" source -- see
            # homelab's README for the full cutover sequence and why it's
            # a rename, not a delete (instant, safe rollback if anything
            # goes wrong mid-migration).
            homeDirectory: /home/drew
            loginShell: /bin/bash
            mail: drewrichardson2@gmail.com
            objectClass: ldapPublicKey
            sshPublicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEJJM6pqkGdAwFpb8kvamLfQLtM+GXAZMf9SgXG5tOTe your_email@example.com

        persistence:
          enabled: true
          storageClass: local-path
          size: 1Gi

        # Self-service password reset UI -- out of scope for getting the
        # directory verified, can add later if wanted.
        ltb-passwd:
          enabled: false

        phpldapadmin:
          enabled: true
          # Ingress left off on purpose: this chart's phpldapadmin Ingress
          # template is hardcoded to extensions/v1beta1, an API group
          # removed from Kubernetes years ago (Ingress lives at
          # networking.k8s.io/v1 now). The `openldap` chart line is
          # frozen at 2.0.4 -- upstream moved on to a differently-named
          # successor chart (openldap-stack-ha) instead of fixing this
          # one. Confirmed via `kubectl get application openldap`: with
          # the ingress enabled, ArgoCD fails the *entire* sync atomically
          # on this one invalid resource, so nothing in this Application
          # applies at all until it's off. phpldapadmin itself still
          # deploys fine -- reachable via `kubectl port-forward` for now.
          # Migrating to openldap-stack-ha is a real option if the
          # ingress becomes worth having later.
          ingress:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openldap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
