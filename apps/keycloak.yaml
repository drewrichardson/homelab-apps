apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: 25.2.0
    helm:
      values: |
        auth:
          adminUser: admin
          # Pinned via a SealedSecret (keycloak-secrets app) from day
          # one -- Grafana and MinIO both had their auto-generated
          # credentials silently rotate on every ArgoCD sync (selfHeal
          # "correcting" the chart's own random-password template
          # re-rendering differently each comparison). existingSecret
          # avoids hitting that bug at all.
          existingSecret: keycloak-admin-credentials
          passwordSecretKey: admin-password

        # Plaintext HTTP behind Traefik -- no TLS termination anywhere
        # else in the cluster either (Grafana/MinIO ingress are also
        # plain HTTP). Internal network only.
        tls:
          enabled: false
        httpEnabled: true

        ingress:
          enabled: true
          ingressClassName: traefik
          hostname: keycloak

        postgresql:
          enabled: true
          auth:
            # Same existingSecret reasoning as above, applied to the
            # bundled Postgres subchart too. Keys must be
            # postgres-password (superuser) and password (bn_keycloak
            # app user) -- the chart's own secret template, which this
            # replaces, expects exactly those two.
            existingSecret: keycloak-postgresql-credentials
          primary:
            persistence:
              storageClass: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
