apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: keycloak
    targetRevision: 25.2.0
    helm:
      values: |
        # Bitnami moved most tags on docker.io/bitnami/* behind a paid
        # tier in 2025, leaving only `latest` free there -- pinned
        # version tags (needed for reproducibility) now live under the
        # bitnamilegacy org instead. Confirmed both images 404 as
        # docker.io/bitnami/*, and resolve fine as bitnamilegacy/*, via
        # `docker manifest inspect`. Applies to the bundled Postgres
        # subchart too (see postgresql.image below).
        image:
          repository: bitnamilegacy/keycloak

        auth:
          adminUser: admin
          # Pinned via a SealedSecret (keycloak-secrets app) from day
          # one -- Grafana and MinIO both had their auto-generated
          # credentials silently rotate on every ArgoCD sync (selfHeal
          # "correcting" the chart's own random-password template
          # re-rendering differently each comparison). existingSecret
          # avoids hitting that bug at all.
          existingSecret: keycloak-admin-credentials
          passwordSecretKey: admin-password

        # Plaintext HTTP behind Traefik -- no TLS termination anywhere
        # else in the cluster either (Grafana/MinIO ingress are also
        # plain HTTP). Internal network only.
        tls:
          enabled: false
        httpEnabled: true

        ingress:
          enabled: true
          ingressClassName: traefik
          hostname: keycloak

        # The chart's default resourcesPreset ("small") caps this at
        # 768Mi, which OOMKilled the pod on first boot -- confirmed via
        # containerStatuses.lastState (exitCode 137, reason OOMKilled)
        # partway through Liquibase's schema migration. Node has 15.7Gi
        # allocatable and was at 4% usage, so headroom isn't the
        # constraint -- the preset just doesn't fit a real Keycloak 26
        # first-boot footprint. Explicit resources override the preset.
        resources:
          requests:
            cpu: 500m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 1536Mi

        postgresql:
          enabled: true
          image:
            repository: bitnamilegacy/postgresql
          auth:
            # Same existingSecret reasoning as above, applied to the
            # bundled Postgres subchart too. Keys must be
            # postgres-password (superuser) and password (bn_keycloak
            # app user) -- the chart's own secret template, which this
            # replaces, expects exactly those two.
            existingSecret: keycloak-postgresql-credentials
          primary:
            persistence:
              storageClass: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
