apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/drewrichardson/homelab-apps.git
    targetRevision: main
    path: minio-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
